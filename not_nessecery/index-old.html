<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordArt 标注工具</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f2ed;--surface:#fff;--surface2:#f0ede8;--surface3:#e8e5de;
  --bd:#dedad2;--bd2:#c8c4bc;
  --tx:#1a1815;--tx2:#6a6762;--tx3:#a09d98;
  --ok:#2a6e35;--ok-bg:#edf7ef;--ok-bd:#9fd0a8;
  --no:#b02a2a;--no-bg:#fdf0f0;--no-bd:#f0a0a0;
  --info:#1a55aa;--info-bg:#edf3fd;--info-bd:#9dc0f0;
  --warn:#8a6000;--warn-bg:#fdf6e8;
  --r:8px;--rl:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;height:100vh;overflow:hidden;display:flex;flex-direction:column}
input,textarea,button{font-family:inherit}
/* Toolbar */
#tb{display:flex;align-items:center;gap:10px;padding:0 14px;height:46px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--bd)}
#tb-brand{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--tx);flex-shrink:0}
#tb-brand span{font-weight:300;color:var(--tx3)}
#tb-st{flex:1;font-size:11px;color:var(--tx3);font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
#tb-acts{display:flex;gap:6px;flex-shrink:0}
.btn{padding:5px 11px;font-size:12px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--surface);color:var(--tx2);cursor:pointer;white-space:nowrap;transition:background .1s}
.btn:hover{background:var(--surface2)}
/* Layout */
#layout{display:flex;flex:1;overflow:hidden}
/* Sidebar */
#sb{width:210px;min-width:210px;display:flex;flex-direction:column;border-right:1px solid var(--bd);background:var(--surface);overflow:hidden}
#sb-search{padding:8px;border-bottom:1px solid var(--bd);flex-shrink:0}
#sb-search input{width:100%;padding:5px 8px;font-size:12px;border:1px solid var(--bd);border-radius:var(--r);background:var(--surface2);color:var(--tx);outline:none}
#sb-search input:focus{border-color:var(--bd2)}
#sb-list{flex:1;overflow-y:auto}
.ag-hd{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--tx2);user-select:none;background:#faf9f7;letter-spacing:.05em}
.ag-hd:hover{background:var(--surface2)}
.ag-cnt{font-weight:400;color:var(--tx3);margin-right:4px}
.ag-arr{font-size:9px;color:var(--tx3);display:inline-block;transition:transform .15s}
.ag-body.clpsd{display:none}
.wi{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 16px;cursor:pointer;border-bottom:1px solid #f0ede8;font-size:12px;color:var(--tx)}
.wi:hover{background:#faf9f7}
.wi.act{background:var(--info-bg);color:var(--info)}
.wi-nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;border:1px solid transparent}
.sb-empty{padding:24px 12px;text-align:center;font-size:12px;color:var(--tx3);line-height:1.7}
/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#main-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:13px}
/* Word header */
#w-hdr{padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--surface);flex-shrink:0}
#w-big{font-size:28px;font-family:'EB Garamond',Georgia,serif;font-weight:400;letter-spacing:-.01em;color:var(--tx);margin-bottom:7px;line-height:1}
#w-transl{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.w-tag{font-size:12px;padding:2px 8px;border-radius:var(--r);background:var(--surface2);color:var(--tx2);border:1px solid var(--bd)}
.w-pos{font-size:10px;font-family:'JetBrains Mono',monospace;padding:1px 4px;border-radius:4px;background:var(--info-bg);color:var(--info);margin-right:4px;border:1px solid var(--info-bd)}
#w-phrases{font-size:12px;color:var(--tx2);margin-top:4px;line-height:1.9}
.ph-w{color:var(--tx);font-weight:500}
#w-prog{display:flex;align-items:center;gap:10px;margin-top:8px}
.prog-bar{flex:1;height:2px;background:var(--bd);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--ok);border-radius:2px;transition:width .3s}
.prog-txt{font-size:11px;color:var(--tx3);white-space:nowrap}
/* Source controls */
#src-ctrl{display:flex;align-items:center;gap:7px;padding:8px 16px;border-bottom:1px solid var(--bd);background:var(--surface);flex-shrink:0;flex-wrap:wrap}
.src-lbl{font-size:11px;color:var(--tx3);flex-shrink:0}
.src-btn{padding:3px 10px;font-size:11px;border:1px solid var(--bd);border-radius:var(--r);background:var(--surface2);color:var(--tx2);cursor:pointer;transition:all .1s;font-family:'JetBrains Mono',monospace}
.src-btn.on{background:var(--tx);color:var(--surface);border-color:var(--tx)}
.src-sep{flex:1}
.src-reload{font-size:11px}
/* Grid area */
#art-area{flex:1;overflow-y:auto;padding:14px 16px}
.art-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
/* Card */
.art-card{display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;background:var(--surface);transition:border-color .2s,opacity .2s}
.art-card.approved{border-color:var(--ok-bd);border-width:1.5px}
.art-card.loading{opacity:.65}
.art-card.err{opacity:.75}
/* Image */
.art-img-wr{aspect-ratio:4/3;background:var(--surface2);position:relative;overflow:hidden;flex-shrink:0}
.art-img-wr img{width:100%;height:100%;object-fit:contain;display:block}
.art-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tx3);flex-direction:column;gap:8px;text-align:center;padding:12px}
.spin{width:20px;height:20px;border:2px solid var(--bd);border-top-color:var(--tx3);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.src-badge{position:absolute;top:6px;right:6px;font-size:10px;font-family:'JetBrains Mono',monospace;padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.92);border:1px solid var(--bd);color:var(--tx2)}
/* Metadata */
.art-meta{padding:10px 12px;flex:1;border-top:1px solid var(--bd)}
.art-title{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:3px;color:var(--tx)}
.art-sub{font-size:11px;color:var(--tx2);margin-bottom:4px;line-height:1.5}
.art-ctx{font-size:11px;background:var(--surface2);border-radius:5px;padding:5px 8px;color:var(--tx2);margin-top:5px;line-height:1.5;word-break:break-word;border:1px solid var(--bd)}
.art-ctx-f{font-size:10px;color:var(--tx3);font-family:'JetBrains Mono',monospace;margin-bottom:2px}
.art-note{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--tx3);margin-top:4px;padding:2px 5px;background:var(--warn-bg);border-radius:3px;display:inline-block}
.art-link{display:inline-block;font-size:11px;color:var(--info);margin-top:4px;text-decoration:none}
.art-link:hover{text-decoration:underline}
/* Feedback */
.art-fb{padding:9px 12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.fb-row{display:flex;align-items:flex-start;gap:5px}
.fb-act{flex-shrink:0;width:76px;padding:5px 3px;font-size:12px;font-weight:500;cursor:pointer;border-radius:var(--r);border:1px solid;background:transparent;transition:background .1s;text-align:center;line-height:1.3}
.fb-ok{border-color:var(--ok-bd);color:var(--ok)}.fb-ok:hover,.fb-ok.sel{background:var(--ok-bg)}
.fb-no{border-color:var(--no-bd);color:var(--no)}.fb-no:hover,.fb-no.sel{background:var(--no-bg)}
.fb-txt{flex:1;font-size:12px;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);background:var(--surface2);color:var(--tx);resize:none;min-height:30px;overflow:hidden;line-height:1.4}
.fb-txt:focus{outline:none;border-color:var(--bd2)}
.fb-sub{flex-shrink:0;padding:5px 8px;font-size:11px;border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;background:transparent;color:var(--tx2);white-space:nowrap}
.fb-sub:hover{background:var(--surface2)}
.no-art{padding:24px;text-align:center;font-size:13px;color:var(--tx3);border:1px dashed var(--bd);border-radius:var(--rl)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
</style>
</head>
<body>
<header id="tb">
  <div id="tb-brand">WordArt <span>标注工具</span></div>
  <div id="tb-st">请加载单词文件（JSON 或 TXT）</div>
  <div id="tb-acts">
    <button class="btn" onclick="document.getElementById('fi-words').click()">加载单词</button>
    <button class="btn" onclick="document.getElementById('fi-fb').click()">加载反馈</button>
    <button class="btn" onclick="exportFB()">导出反馈</button>
  </div>
</header>
<div id="layout">
  <aside id="sb">
    <div id="sb-search"><input type="text" id="sb-inp" placeholder="搜索单词…"></div>
    <div id="sb-list"><div class="sb-empty">加载 JSON 或 TXT 单词文件<br>即可开始标注</div></div>
  </aside>
  <div id="main"><div id="main-empty">← 从左侧选择单词开始</div></div>
</div>
<input type="file" id="fi-words" accept=".json,.txt" style="display:none">
<input type="file" id="fi-fb" accept=".json" style="display:none">

<script>
// ═══ STATE ═══════════════════════════════════════════
let W = {};       // word → {word, translations?, phrases?}
let FB = {};      // 'word||id' → {word,id,status,note,title,image_url,page_url,source,ts}
let CW = null;    // current word
let SQ = '';      // sidebar search query
let CARDS = {};   // word → [{...artwork, status:'pending'|'approved'}]
let POOL = {};    // 'word:src' → {items:[],cursor:0,metIds:[],metCursor:0,page:2,sroffset:null,exhausted:false}
const MAX = 2;    // items per source
const AS = new Set(['met','wiki','archive','wikiart']); // active sources
const SRC_LABELS = {met:'Met',wiki:'Wikimedia',archive:'Archive',wikiart:'WikiArt'};
const LS_KEY = 'waf3_fb';

// ═══ PERSISTENCE ══════════════════════════════════════
function loadFBLocal(){try{FB=JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch{FB={}}}
function saveFBLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(FB));}catch{}}
function fbKey(w,id){return w+'||'+id}
function setFB(w,id,status,note,artData){
  FB[fbKey(w,id)]={word:w,id,status,note:note||'',...artData,ts:new Date().toISOString()};
  saveFBLocal();
}
function getFB(w,id){return FB[fbKey(w,id)]||null}

// ═══ UTILITIES ════════════════════════════════════════
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sid(s){return String(s).replace(/[^a-z0-9]/gi,'_')}
function containsWord(text,word){
  if(!text||!word)return false;
  if(/[^\x00-\x7F]/.test(word))return text.toLowerCase().includes(word.toLowerCase());
  const e=word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp('(?<![a-zA-Z])'+e+'(?![a-zA-Z])','i').test(text);
}
function findMatchCtx(fields,word){
  const e=word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=/[^\x00-\x7F]/.test(word)?new RegExp(word,'i'):new RegExp('(?<![a-zA-Z])'+e+'(?![a-zA-Z])','i');
  for(const {name,text} of fields){
    if(!text)continue;
    const i=text.search(re);
    if(i===-1)continue;
    const s=Math.max(0,i-60),end=Math.min(text.length,i+word.length+60);
    return{field:name,excerpt:(s>0?'…':'')+text.slice(s,end)+(end<text.length?'…':'')};
  }
  return null;
}
function errMsg(d){
  if(!d)return '无响应';
  if(d.__error==='timeout')return '超时';
  if(d.__error==='cors')return '跨域限制（CORS）';
  if(d.__error==='http')return `HTTP ${d.status}`;
  if(d.__error==='network')return '网络错误';
  return '未知错误';
}

// ═══ FETCH ════════════════════════════════════════════
async function fj(url){
  try{
    const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),15000);
    const r=await fetch(url,{headers:{'User-Agent':'WordArtTool/1.0'},signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok)return{__error:'http',status:r.status};
    return await r.json();
  }catch(e){
    if(e.name==='AbortError')return{__error:'timeout'};
    if(e.message&&(e.message.includes('fetch')||e.message.includes('CORS')))return{__error:'cors'};
    return{__error:'network',msg:e.message};
  }
}

// ═══ SEARCH FUNCTIONS ══════════════════════════════════
// Each returns {item, hasMore} or {error}
async function fetchMetNext(word,pk){
  let p=POOL[pk]||={metIds:[],metCursor:0,exhausted:false};
  if(!p.initialized){
    p.initialized=true;
    const d=await fj(`https://collectionapi.metmuseum.org/public/collection/v1/search?hasImages=true&q=${encodeURIComponent(word)}`);
    if(d?.__error)return{error:errMsg(d)};
    if(!d?.objectIDs?.length)return{error:'无结果'};
    p.metIds=d.objectIDs;p.total=d.total||d.objectIDs.length;
  }
  while(p.metCursor<p.metIds.length){
    const id=p.metIds[p.metCursor++];
    const d=await fj(`https://collectionapi.metmuseum.org/public/collection/v1/objects/${id}`);
    if(!d||d.__error||!d.primaryImageSmall)continue;
    const fields=[
      {name:'title',text:d.title||''},{name:'tags',text:(d.tags||[]).map(t=>t.term).join(', ')},
      {name:'objectName',text:d.objectName||''},{name:'culture',text:d.culture||''},
      {name:'medium',text:d.medium||''},{name:'artist',text:d.artistDisplayName||''},
    ];
    const mc=findMatchCtx(fields,word);
    return{item:{id:'met_'+id,title:d.title||'',artist:d.artistDisplayName||'',year:d.objectDate||'',
      source:'met',image_url:d.primaryImageSmall,image_url_large:d.primaryImage,page_url:d.objectURL||'',
      match_context:mc,note:mc?'字段匹配('+mc.field+')':'仅搜索命中'},hasMore:p.metCursor<p.metIds.length};
  }
  p.exhausted=true;return{error:'已无更多'};
}

async function fetchWikiNext(word,pk){
  let p=POOL[pk]||={items:[],cursor:0,sroffset:null,exhausted:false,initialized:false};
  // Try from cached items
  while(p.cursor<p.items.length){
    const item=p.items[p.cursor++];
    const k=fbKey(word,item.id);if(FB[k]?.status==='rejected')continue;
    return{item,hasMore:true};
  }
  if(p.exhausted)return{error:'已无更多'};
  // Fetch next page
  const off=p.sroffset?`&sroffset=${p.sroffset}`:'';
  const d=await fj(`https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(word)}&srnamespace=6&srlimit=8&srprop=snippet|titlesnippet&format=json&origin=*${off}`);
  if(d?.__error)return{error:errMsg(d)};
  if(!d?.query?.search?.length){p.exhausted=true;return{error:'已无更多'};}
  const cont=d['query-continue']?.search?.sroffset??d.continue?.sroffset??null;
  p.sroffset=cont;if(!cont)p.exhausted=true;
  for(const item of d.query.search){
    const rawFN=item.title.replace('File:',''),fn=rawFN.replace(/\.[^.]+$/,'').replace(/_/g,' ');
    const sn=item.snippet?.replace(/<[^>]+>/g,'')||'';
    const mc=findMatchCtx([{name:'filename',text:fn},{name:'snippet',text:sn}],word);
    if(!mc)continue;
    p.items.push({id:'wiki_'+item.pageid,title:fn,artist:'',year:'',source:'wikimedia',
      image_url:`https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(rawFN)}?width=600`,
      image_url_large:`https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(rawFN)}`,
      page_url:`https://commons.wikimedia.org/wiki/${encodeURIComponent(item.title)}`,match_context:mc,note:''});
  }
  while(p.cursor<p.items.length){
    const item=p.items[p.cursor++];
    const k=fbKey(word,item.id);if(FB[k]?.status==='rejected')continue;
    return{item,hasMore:!p.exhausted};
  }
  return p.exhausted?{error:'已无更多'}:{error:'当前批次无匹配，点击来源按钮继续'};
}

async function fetchArchiveNext(word,pk){
  let p=POOL[pk]||={items:[],cursor:0,page:1,exhausted:false};
  while(p.cursor<p.items.length){
    const item=p.items[p.cursor++];
    const k=fbKey(word,item.id);if(FB[k]?.status==='rejected')continue;
    return{item,hasMore:true};
  }
  if(p.exhausted)return{error:'已无更多'};
  const queries=[`${word} AND mediatype:image`,`title:(${word}) AND mediatype:image`];
  const q=queries[(p.page-1)%queries.length];
  const pg=Math.ceil(p.page/queries.length);
  const d=await fj(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}&fl[]=identifier,title,creator,date,description&rows=8&page=${pg}&output=json`);
  p.page++;
  if(d?.__error)return{error:errMsg(d)};
  if(!d?.response?.docs?.length){p.exhausted=true;return{error:'已无更多'};}
  for(const item of d.response.docs){
    const ts=item.title||'',ds=(item.description||'').toString();
    const mc=findMatchCtx([{name:'title',text:ts},{name:'description',text:ds}],word);
    if(!mc)continue;
    p.items.push({id:'archive_'+item.identifier,title:ts,artist:item.creator||'',year:item.date||'',
      source:'archive',image_url:`https://archive.org/services/img/${item.identifier}`,
      image_url_large:`https://archive.org/services/img/${item.identifier}`,
      page_url:`https://archive.org/details/${item.identifier}`,match_context:mc,note:''});
  }
  while(p.cursor<p.items.length){
    const item=p.items[p.cursor++];
    const k=fbKey(word,item.id);if(FB[k]?.status==='rejected')continue;
    return{item,hasMore:true};
  }
  return{error:'当前批次无匹配，继续搜索中'};
}

async function fetchWikiArtNext(word,pk){
  let p=POOL[pk]||={items:[],cursor:0,page:1,exhausted:false};
  while(p.cursor<p.items.length){
    const item=p.items[p.cursor++];
    const k=fbKey(word,item.id);if(FB[k]?.status==='rejected')continue;
    return{item,hasMore:true};
  }
  if(p.exhausted)return{error:'已无更多'};
  const d=await fj(`https://www.wikiart.org/en/search/${encodeURIComponent(word)}/${p.page}?json=2`);
  p.page++;
  if(d?.__error)return{error:errMsg(d)};
  const items=Array.isArray(d)?d:(d?.paintings||[]);
  if(!items.length){p.exhausted=true;return{error:'已无更多'};}
  for(const item of items){
    if(!item.image)continue;
    const ts=item.title||'';
    const mc=findMatchCtx([{name:'title',text:ts}],word);
    if(!mc)continue;
    p.items.push({id:'wikiart_'+(item.contentId||item.id||ts),title:ts,
      artist:item.artistName||'',year:item.completitionYear?String(item.completitionYear):'',
      source:'wikiart',image_url:item.image,image_url_large:item.image,
      page_url:item.url?`https://www.wikiart.org${item.url}`:'',match_context:mc,note:'标题匹配'});
  }
  while(p.cursor<p.items.length){
    const item=p.items[p.cursor++];
    const k=fbKey(word,item.id);if(FB[k]?.status==='rejected')continue;
    return{item,hasMore:!p.exhausted};
  }
  return p.exhausted?{error:'已无更多'}:{error:'当前页无匹配'};
}

const FETCHERS={met:fetchMetNext,wiki:fetchWikiNext,archive:fetchArchiveNext,wikiart:fetchWikiArtNext};

// ═══ WORD STATUS ══════════════════════════════════════
function wordStat(word){
  const cards=CARDS[word]||[];
  const wfb=Object.keys(FB).filter(k=>k.startsWith(word+'||'));
  if(!wfb.length&&!cards.length)return'none';
  const apv=wfb.filter(k=>FB[k].status==='approved').length;
  if(apv>0&&cards.filter(c=>c.status==='pending').length===0)return'complete';
  if(apv>0)return'partial';
  return'none';
}
function dotColor(s){return{none:'var(--bd2)',partial:'#d4920a',complete:'var(--ok)',}[s]||'var(--bd2)'}

// ═══ SIDEBAR ══════════════════════════════════════════
function renderSB(){
  const words=Object.keys(W).sort(),q=SQ.toLowerCase().trim();
  const filtered=q?words.filter(w=>w.toLowerCase().includes(q)):words;
  if(!words.length){document.getElementById('sb-list').innerHTML='<div class="sb-empty">加载 JSON 或 TXT<br>单词文件即可开始</div>';return;}
  const groups={};
  filtered.forEach(w=>{const l=w[0].toUpperCase();(groups[l]=groups[l]||[]).push(w);});
  let html='';
  Object.keys(groups).sort().forEach(letter=>{
    const ws=groups[letter],open=CW&&ws.includes(CW);
    html+=`<div class="ag">
      <div class="ag-hd" onclick="toggleAg(this)">
        <span>${letter}</span>
        <span><span class="ag-cnt">${ws.length}</span><span class="ag-arr" style="${open?'transform:rotate(90deg)':''}">▶</span></span>
      </div>
      <div class="ag-body${open?'':' clpsd'}">
        ${ws.map(w=>`<div class="wi${CW===w?' act':''}" onclick="selWord('${esc(w)}')" data-w="${esc(w)}">
          <span class="wi-nm">${esc(w)}</span>
          <span class="wi-dot" style="background:${dotColor(wordStat(w))}"></span>
        </div>`).join('')}
      </div>
    </div>`;
  });
  document.getElementById('sb-list').innerHTML=html;
}
function toggleAg(el){
  const body=el.nextElementSibling,arr=el.querySelector('.ag-arr');
  body.classList.toggle('clpsd');
  arr.style.transform=body.classList.contains('clpsd')?'':'rotate(90deg)';
}
function updDot(word){
  document.querySelectorAll('.wi').forEach(el=>{
    if(el.dataset.w===word){
      const d=el.querySelector('.wi-dot');
      if(d)d.style.background=dotColor(wordStat(word));
    }
  });
}

// ═══ MAIN RENDER ══════════════════════════════════════
function renderMain(word){
  const mn=document.getElementById('main');
  const wd=W[word]||{};
  const cards=CARDS[word]||[];
  const wid=sid(word);

  const totalFB=Object.keys(FB).filter(k=>k.startsWith(word+'||')).length;
  const apv=Object.keys(FB).filter(k=>k.startsWith(word+'||')&&FB[k].status==='approved').length;
  const pct=totalFB>0?Math.round(apv/totalFB*100):0;

  const transHTML=(wd.translations||[]).map(t=>`<span class="w-tag"><span class="w-pos">${esc(t.type)}</span>${esc(t.translation)}</span>`).join('');
  const phHTML=wd.phrases?.length?`<div id="w-phrases">${wd.phrases.map(p=>`<span style="margin-right:14px"><span class="ph-w">${esc(p.phrase)}</span> — ${esc(p.translation)}</span>`).join('')}</div>`:'';

  const srcBtns=Object.entries(SRC_LABELS).map(([id,label])=>
    `<button class="btn src-btn${AS.has(id)?' on':''}" onclick="toggleSrc('${id}','${esc(word)}')">${label}</button>`
  ).join('');

  let gridHTML='';
  if(cards.length===0){
    gridHTML=`<div class="no-art">正在搜索艺术品…<br><span style="font-size:11px;color:var(--tx3)">若无来源已开启，请先点击上方来源按钮</span></div>`;
  } else {
    gridHTML=`<div class="art-grid">${cards.map(c=>renderCard(word,c)).join('')}</div>`;
  }

  mn.innerHTML=`
    <div id="w-hdr">
      <div id="w-big">${esc(word)}</div>
      <div id="w-transl">${transHTML}</div>
      ${phHTML}
      <div id="w-prog">
        <span class="prog-txt" id="prog-txt-${wid}">${apv} 合格 / ${totalFB} 已标注</span>
        <div class="prog-bar"><div class="prog-fill" id="prog-fill-${wid}" style="width:${pct}%"></div></div>
        <span class="prog-txt">${pct}%</span>
      </div>
    </div>
    <div id="src-ctrl">
      <span class="src-lbl">来源：</span>${srcBtns}
      <span class="src-sep"></span>
      <button class="btn src-reload" onclick="reloadWord('${esc(word)}')">重新搜索</button>
    </div>
    <div id="art-area"><div id="art-grid-wr">${gridHTML}</div></div>`;

  bindCardEvents(word);
}

function renderCard(word,card){
  const a=card.art||card;
  const status=card.status||'pending';
  const fb=getFB(word,a.id);
  const okSel=fb?.status==='approved'?'sel':'';
  const noSel=fb?.status==='rejected'?'sel':'';
  const okNote=fb?.status==='approved'?esc(fb.note||''):'';
  const noNote=fb?.status==='rejected'?esc(fb.note||''):'';
  const sub=[a.artist,a.year].filter(Boolean).join(' · ');
  const ctxHTML=a.match_context?`<div class="art-ctx"><div class="art-ctx-f">${esc(a.match_context.field)}</div>${esc(a.match_context.excerpt)}</div>`:'';
  const noteHTML=a.note&&a.note!=='标题匹配'?`<div class="art-note">${esc(a.note)}</div>`:'';
  const imgHTML=a.image_url
    ?`<img src="${esc(a.image_url)}" loading="lazy" alt="${esc(a.title)}" onerror="this.outerHTML='<div class=art-img-ph>图片加载失败</div>'">`
    :'<div class="art-img-ph"><div>无图片</div></div>';
  return `<div class="art-card${status==='approved'?' approved':''}" data-id="${esc(a.id)}" data-src="${esc(a.source||'')}">
    <div class="art-img-wr">${imgHTML}<span class="src-badge">${esc(SRC_LABELS[a.source]||a.source||'')}</span></div>
    <div class="art-meta">
      <div class="art-title">${esc(a.title||'（无标题）')}</div>
      ${sub?`<div class="art-sub">${esc(sub)}</div>`:''}
      ${ctxHTML}${noteHTML}
      ${a.page_url?`<a class="art-link" href="${esc(a.page_url)}" target="_blank">查看原页面 ↗</a>`:''}
    </div>
    <div class="art-fb">
      <div class="fb-row">
        <button class="fb-act fb-ok ${okSel}" data-action="approved">✓ 合格</button>
        <textarea class="fb-txt" data-for="approved" placeholder="合格说明（可选）…">${okNote}</textarea>
        <button class="fb-sub" data-submit="approved">提交</button>
      </div>
      <div class="fb-row">
        <button class="fb-act fb-no ${noSel}" data-action="rejected">✗ 不合格</button>
        <textarea class="fb-txt" data-for="rejected" placeholder="不合格原因…">${noNote}</textarea>
        <button class="fb-sub" data-submit="rejected">提交</button>
      </div>
    </div>
  </div>`;
}

function bindCardEvents(word){
  document.querySelectorAll('.art-card').forEach(card=>{
    const id=card.dataset.id,src=card.dataset.src;
    card.querySelectorAll('.fb-act').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const status=btn.dataset.action;
        const a=findCardArt(word,id);
        setFB(word,id,status,'',{title:a?.title||'',image_url:a?.image_url||'',page_url:a?.page_url||'',source:src});
        updateCardStatus(word,id,status);
        if(status==='rejected')replaceCard(word,id,src);
      });
    });
    card.querySelectorAll('.fb-sub').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const status=btn.dataset.submit;
        const note=card.querySelector(`.fb-txt[data-for="${status}"]`)?.value||'';
        const a=findCardArt(word,id);
        setFB(word,id,status,note,{title:a?.title||'',image_url:a?.image_url||'',page_url:a?.page_url||'',source:src});
        updateCardStatus(word,id,status);
        btn.textContent='✓';setTimeout(()=>btn.textContent='提交',1500);
        if(status==='rejected')replaceCard(word,id,src);
      });
    });
    card.querySelectorAll('.fb-txt').forEach(ta=>{
      ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,80)+'px';});
    });
  });
}

function findCardArt(word,id){
  return (CARDS[word]||[]).find(c=>(c.art||c).id===id)?.art||(CARDS[word]||[]).find(c=>(c.art||c).id===id);
}

function updateCardStatus(word,id,status){
  const cards=CARDS[word]||[];
  cards.forEach(c=>{const a=c.art||c;if(a.id===id)c.status=status;});
  const el=document.querySelector(`.art-card[data-id="${CSS.escape(id)}"]`);
  if(!el)return;
  el.classList.toggle('approved',status==='approved');
  el.querySelector('.fb-ok')?.classList.toggle('sel',status==='approved');
  el.querySelector('.fb-no')?.classList.toggle('sel',status==='rejected');
  updProg(word);updDot(word);
}

async function replaceCard(word,id,src){
  if(!src)return;
  // Remove from CARDS
  CARDS[word]=(CARDS[word]||[]).filter(c=>(c.art||c).id!==id);
  // Fetch replacement
  const el=document.querySelector(`.art-card[data-id="${CSS.escape(id)}"]`);
  if(el){
    el.innerHTML=`<div class="art-img-wr"><div class="art-img-ph"><div class="spin"></div><div style="font-size:11px;color:var(--tx3)">加载中…</div></div></div>`;
    el.classList.remove('approved');
  }
  const pk=word+':'+src;
  const fetcher=FETCHERS[src];
  if(!fetcher){if(el)el.remove();return;}
  const result=await fetcher(word,pk);
  if(result.error){
    if(el)el.innerHTML=`<div class="art-img-wr"><div class="art-img-ph"><div style="color:var(--no)">${esc(result.error)}</div></div></div><div class="art-meta" style="padding:10px 12px;font-size:12px;color:var(--tx3)">该来源暂无更多匹配结果</div>`;
    return;
  }
  const newCard={art:result.item,status:'pending'};
  CARDS[word]=CARDS[word]||[];CARDS[word].push(newCard);
  if(el){
    el.dataset.id=result.item.id;el.dataset.src=result.item.source||'';
    el.outerHTML=renderCard(word,newCard);
    // Rebind all events
    bindCardEvents(word);
  }
  updDot(word);
}

function updProg(word){
  const wid=sid(word);
  const totalFB=Object.keys(FB).filter(k=>k.startsWith(word+'||')).length;
  const apv=Object.keys(FB).filter(k=>k.startsWith(word+'||')&&FB[k].status==='approved').length;
  const pct=totalFB>0?Math.round(apv/totalFB*100):0;
  const pf=document.getElementById('prog-fill-'+wid);
  const pt=document.getElementById('prog-txt-'+wid);
  if(pf)pf.style.width=pct+'%';
  if(pt)pt.textContent=`${apv} 合格 / ${totalFB} 已标注`;
}

// ═══ WORD SELECTION ════════════════════════════════════
async function selWord(word){
  CW=word;
  document.querySelectorAll('.wi').forEach(el=>el.classList.toggle('act',el.dataset.w===word));
  // Init CARDS if not yet (restore approved from FB)
  if(!CARDS[word]){
    CARDS[word]=[];
    // Restore approved items from FB
    Object.values(FB).filter(f=>f.word===word&&f.status==='approved').forEach(f=>{
      CARDS[word].push({art:{id:f.id,title:f.title||'',artist:'',year:'',source:f.source||'',
        image_url:f.image_url||'',image_url_large:f.image_url||'',page_url:f.page_url||'',
        match_context:null,note:'从反馈记录恢复'},status:'approved'});
    });
  }
  renderMain(word);
  // Search each active source
  for(const src of AS){
    await searchAndShowSource(word,src,MAX);
  }
}

async function searchAndShowSource(word,src,count){
  const fetcher=FETCHERS[src];
  if(!fetcher)return;
  const pk=word+':'+src;
  const existing=(CARDS[word]||[]).filter(c=>(c.art||c).source===src).length;
  const need=count-existing;
  if(need<=0)return;
  for(let i=0;i<need;i++){
    const result=await fetcher(word,pk);
    if(result.error)break;
    const card={art:result.item,status:'pending'};
    CARDS[word]=CARDS[word]||[];CARDS[word].push(card);
    // Append to grid
    const gw=document.getElementById('art-grid-wr');
    if(gw){
      let grid=gw.querySelector('.art-grid');
      if(!grid){gw.innerHTML='<div class="art-grid"></div>';grid=gw.querySelector('.art-grid');}
      const tmp=document.createElement('div');
      tmp.innerHTML=renderCard(word,card);
      grid.appendChild(tmp.firstChild);
      bindCardEvents(word);
    }
    updDot(word);
  }
}

function toggleSrc(src,word){
  if(AS.has(src))AS.delete(src);else AS.add(src);
  // Update button UI
  document.querySelectorAll('.src-btn').forEach(btn=>{
    if(btn.textContent===SRC_LABELS[src])btn.classList.toggle('on',AS.has(src));
  });
  if(AS.has(src)&&word)searchAndShowSource(word,src,MAX);
}

async function reloadWord(word){
  CARDS[word]=[];
  POOL=Object.fromEntries(Object.entries(POOL).filter(([k])=>!k.startsWith(word+':')));
  // Restore approved
  Object.values(FB).filter(f=>f.word===word&&f.status==='approved').forEach(f=>{
    CARDS[word].push({art:{id:f.id,title:f.title||'',artist:'',year:'',source:f.source||'',
      image_url:f.image_url||'',image_url_large:f.image_url||'',page_url:f.page_url||'',
      match_context:null,note:'从反馈记录恢复'},status:'approved'});
  });
  renderMain(word);
  for(const src of AS)await searchAndShowSource(word,src,MAX);
}

// ═══ FILE LOADING ═════════════════════════════════════
function readFile(file,cb){const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsText(file);}

function loadWordFile(file){
  readFile(file,text=>{
    W={};
    if(file.name.endsWith('.txt')){
      text.split('\n').map(l=>l.trim()).filter(Boolean).forEach(w=>{W[w]={word:w};});
    } else {
      try{
        const data=JSON.parse(text);
        const arr=Array.isArray(data)?data:Object.values(data);
        arr.forEach(item=>{
          if(typeof item==='string'){W[item]={word:item};}
          else if(item.word){W[item.word]=item;}
        });
      }catch{alert('JSON解析失败');}
    }
    CARDS={};POOL={};
    updSt();renderSB();
    document.getElementById('main').innerHTML='<div id="main-empty">← 从左侧选择单词开始</div>';
    CW=null;
  });
}

function loadFBFile(file){
  readFile(file,text=>{
    try{
      const data=JSON.parse(text);
      // Support both the full export format and raw FB object
      if(data.approved||data.rejected){
        [...(data.approved||[]),...(data.rejected||[])].forEach(f=>{
          const status=data.approved?.includes(f)?'approved':'rejected';
          FB[fbKey(f.word,f.artwork_id||f.id)]={word:f.word,id:f.artwork_id||f.id,status:f.status||status,
            note:f.note||'',title:f.title||'',image_url:f.image_url||'',page_url:f.page_url||'',source:f.source||'',ts:f.timestamp||''};
        });
      } else {
        Object.assign(FB,data);
      }
      saveFBLocal();
      renderSB();
      if(CW)renderMain(CW);
      alert('反馈记录已加载');
    }catch{alert('反馈文件解析失败');}
  });
}

function updSt(){
  const wc=Object.keys(W).length;
  const apv=Object.values(FB).filter(f=>f.status==='approved').length;
  const rej=Object.values(FB).filter(f=>f.status==='rejected').length;
  document.getElementById('tb-st').textContent=`${wc} 个单词 | 已标注：${apv} 合格，${rej} 不合格`;
}

// ═══ EXPORT ════════════════════════════════════════════
function exportFB(){
  const approved=[],rejected=[],rejIds=[];
  Object.values(FB).forEach(f=>{
    const e={word:f.word,artwork_id:f.id,title:f.title||'',source:f.source||'',
      image_url:f.image_url||'',page_url:f.page_url||'',note:f.note||'',timestamp:f.ts};
    if(f.status==='approved')approved.push(e);
    else if(f.status==='rejected'){rejected.push(e);rejIds.push(f.id);}
  });
  const out={exported_at:new Date().toISOString(),
    stats:{approved:approved.length,rejected:rejected.length,total:approved.length+rejected.length},
    approved,rejected,rejected_ids:rejIds};
  const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`wordart_feedback_${new Date().toISOString().slice(0,10)}.json`;a.click();
}

// ═══ INIT ════════════════════════════════════════════
loadFBLocal();updSt();
document.getElementById('fi-words').addEventListener('change',e=>{if(e.target.files[0])loadWordFile(e.target.files[0]);e.target.value='';});
document.getElementById('fi-fb').addEventListener('change',e=>{if(e.target.files[0])loadFBFile(e.target.files[0]);e.target.value='';});
document.getElementById('sb-inp').addEventListener('input',e=>{SQ=e.target.value;renderSB();});
</script>
